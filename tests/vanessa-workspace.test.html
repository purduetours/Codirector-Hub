<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vanessa workspace tests</title>
<!--
  Vanessa's understanding, writing, memory and permissions, with the real
  modules and in-memory data — nothing here talks to the database.
  Serve the project folder and open this page, e.g.
    python3 -m http.server 8000   then   http://localhost:8000/tests/vanessa.test.html
-->
<style>
  body { font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; margin: 32px; color: #17150f; background: #f5f2eb; }
  h1 { font-size: 20px; } h2 { font-size: 15px; margin-top: 22px; } .ok { color: #2e7d4f; } .bad { color: #a3222a; font-weight: 700; }
  li { margin: 3px 0; } #sum { font-weight: 700; margin-top: 16px; }
</style>
</head>
<body>
<h1>Vanessa tests</h1>
<div id="out"></div>
<p id="sum"></p>
<script>window.CONFIG = { SUPABASE_URL: 'https://example.invalid', SUPABASE_KEY: 'test', TERM_LABEL: 'Fall 2026' };</script>
<script type="module">
  import { state } from '../js/core/state.js';
  import { register } from '../js/core/router.js';
  import { understand } from '../js/core/vanessa-language.js';
  import { polishFeedback, explicitRating } from '../js/core/vanessa-write.js';
  import { explainError } from '../js/core/vanessa-errors.js';
  import * as mem from '../js/core/vanessa-memory.js';
  import { interpret } from '../js/core/vanessa-os.js';
  import { share, registerLoaders } from '../js/core/vanessa-data.js';
  import evals from '../js/modules/evals.js';
  import interviews from '../js/modules/interviews.js';
  import schedule from '../js/modules/schedule.js';
  import directory from '../js/modules/directory.js';
  import desks from '../js/modules/desks.js';
  import announcements from '../js/modules/announcements.js';
  import today from '../js/modules/today.js';
  import people from '../js/modules/people.js';
  import training from '../js/modules/training.js';
  import health from '../js/modules/health.js';
  [today, announcements, evals, interviews, training, schedule, directory, desks, people, health].forEach(register);

  import { runWorkflow, operationIntent, handleOperations } from '../js/core/vanessa-operations.js';
  import { resetConversation, recentReceipts, rememberConversation, pendingReview, currentDraft } from '../js/core/vanessa-conversation.js';
  import { validateProposal } from '../js/core/vanessa-understanding.js';
  import { makeupRequest } from '../js/core/vanessa-makeup.js';
  import { todayISO } from '../js/core/ui.js';
  let pass=0,fail=0,rows=[],writes=[],failWrite=null,serial=0,denyRead=false;
  const check=(label,ok)=>{ok?pass++:fail++;document.querySelector('#out').insertAdjacentHTML('beforeend',`<li class="${ok?'ok':'bad'}">${ok?'✓':'✗'} ${label}</li>`);};
  const sessions=[{id:'s1',label:'September 21st',held_on:'2026-09-21'},{id:'s2',label:'October 5th',held_on:'2026-10-05'}];
  const sourceFetch=window.fetch;
  window.fetch=async(url,opts={})=>{
    if(!String(url).startsWith('https://example.invalid/rest/v1/'))throw new Error('Blocked external request');
    const u=new URL(url),table=u.pathname.split('/').at(-1);
    if(opts.method==='PATCH') {
      const id=u.searchParams.get('id').slice(3); writes.push({id,filter:u.search,patch:JSON.parse(opts.body)});
      if(id===failWrite)return new Response(JSON.stringify({message:'Injected failure'}),{status:500});
      const row=rows.find(r=>r.id===id);
      const matches=row && [...u.searchParams].every(([key,v])=>v==='is.null'?row[key]==null:v.startsWith('eq.')?String(row[key])===v.slice(3):false);
      if(!matches)return new Response('[]');
      Object.assign(row,JSON.parse(opts.body),{updated_at:`2026-09-28T12:00:${String(++serial).padStart(2,'0')}Z`});
      return new Response(JSON.stringify([row]));
    }
    if(denyRead && table==='training_sessions')return new Response('{}',{status:500});
    if(table==='training_history')return new Response(JSON.stringify([{id:1,attendance_id:'a',session_id:'s1',person_name:'Ella Smith',field:'actual',was:'Absent, Need Makeup',became:'Makeup Completed',changed_at:'2026-09-28T12:00:00Z',changed_by:'me'}]));
    return new Response(JSON.stringify(table==='training_sessions'?sessions:table==='training_attendance'?rows:table==='members'?[{id:'me',full_name:'Logan'}]:[]));
  };
  const setup=(data=[['a','Ella Smith','s1']])=>{
    rows=data.map(([id,name,sid])=>({id,person_name:name,session_id:sid,actual:'Absent, Need Makeup',makeup_on:null,makeup_note:null,updated_at:'2026-09-28T11:00:00Z'}));
    writes=[];failWrite=null;serial=0;denyRead=false;state.sessionVersion++;
    state.role={name:'Codirector',is_admin:true,in_training:true};state.me={id:'me',full_name:'Logan'};
    state.guides=[{id:'ella',name:'Ella Smith',status:'open',rank:1,priority:'First priority',tours:[{date:todayISO(),start:'14:00'}]},
      {id:'noah',name:'Noah Jones',status:'claimed',evaluatorId:'me',evaluator:'Logan',rank:2,priority:'Second priority',tours:[]}];
    state.loadedAt=new Date();state.guideToursLoaded=true;
    mem.resetMemory();resetConversation();training.bust();registerLoaders({training:()=>training.prefetch()});
  };
  const run=q=>interpret(q);
  setup([['a','Ella Smith','s1'],['b','Noah Jones','s1']]);
  let result=await run('Ella and Noah completed makeup training');
  check('Batch reviews both people before saving',result.type==='confirm' && result.rows.length===2 && !writes.length);
  result=await run('yes');
  check('Typed confirmation saves the whole batch',result.kind==='confirm' && writes.length===2 && rows.every(r=>r.actual==='Makeup Completed'));
  check('Batch receipt offers undo',result.actions.some(a=>a.label==='Undo this update') && recentReceipts()[0].changes.length===2);
  result=await run('undo that');
  check('Undo restores both original records',/Restored 2/.test(result.text) && rows.every(r=>r.actual==='Absent, Need Makeup'));
  result=await run('undo that');
  check('Repeated undo does not write',writes.length===4);

  setup();result=await run('Ella completed makeup training yesterday after meeting with Logan');
  check('Date and note appear in review',result.type==='confirm' && result.rows.some(([k,v])=>k==='Note'&&v==='meeting with Logan'));
  await result.confirm.run();
  check('Completion details persist',rows[0].makeup_on===makeupRequest('Ella completed makeup yesterday').completedOn && rows[0].makeup_note==='meeting with Logan');
  await run('undo that');check('Undo restores date and note as well as status',rows[0].makeup_on===null&&rows[0].makeup_note===null&&rows[0].actual==='Absent, Need Makeup');

  setup();result=await run('Ella completed makeup training');
  rows[0].makeup_note='Edited by someone else';rows[0].updated_at='2026-09-28T13:00:00Z';
  result=await run('undo');
  check('Undo protects intervening edits',result.kind==='alert'&&rows[0].actual==='Makeup Completed'&&rows[0].makeup_note==='Edited by someone else');

  setup([['a','Ella Smith','s1'],['b','Noah Jones','s1']]);
  result=await run('Ella and Noah completed makeup training');
  const oldReview=result;await run('cancel');await oldReview.confirm.run();
  check('Cancelled review cannot be executed later',!writes.length);
  result=await run('Ella and Noah completed makeup training');
  state.me={id:'other',full_name:'Other Admin'};state.sessionVersion++;await result.confirm.run();
  check('Review is bound to the signed-in account',!writes.length);

  setup([['a','Ella Smith','s1'],['b','Noah Jones','s1']]);
  result=await run('Ella and Noah completed makeup training');failWrite='b';
  result=await result.confirm.run();
  check('Partial batch failure reports exact progress',result.kind==='error' && /1 of 2/.test(result.text));
  check('Partial success remains undoable',recentReceipts()[0].changes.length===1);
  failWrite=null;await run('undo');check('Undo of partial batch touches only saved rows',rows.every(r=>r.actual==='Absent, Need Makeup'));

  setup([['a','Ella Smith','s1'],['b','Ella Jones','s1']]);
  result=await run('Ella completed makeup training');
  check('Shared first names still need clarification',result.type==='select'&&result.options.length===2&&!writes.length);
  await result.options[1].run();check('Ambiguity choice saves selected person only',rows[0].actual==='Absent, Need Makeup'&&rows[1].actual==='Makeup Completed');

  setup();await run('Show Ella’s profile');result=await run('She completed her makeup training');
  check('Pronoun refers to current profile',result.kind==='confirm'&&writes.length===1);
  setup();await run('Someone completed makeup training yesterday');result=await run('Ella Smith');
  check('Follow-up name retains the completion date',result.type==='confirm'&&result.rows.some(([key])=>key==='Completed on'));
  setup();result=await run('Ella completed makeup training on 2026-02-30');
  check('Invalid date never writes',result.kind==='alert'&&!writes.length);
  setup();result=await run('Ella completed makeup training for December 99th');
  check('Unknown session never clears other sessions',!writes.length&&/don’t see/.test(result.text));

  setup([['a','Ella Smith','s1'],['b','Noah Jones','s2']]);
  result=await run('Brief me');
  check('Briefing combines training and evaluations',result.rows.some(([k])=>k==='Makeup training')&&result.rows.some(([k])=>k==='Evaluation progress'));
  result=await run('Prepare a meeting agenda');result=await result.actions[0].run();
  check('Meeting agenda is an editable draft',result.type==='draft'&&result.draft.includes('Decisions and owners'));
  result.onEdit('My edited agenda');check('Draft remembers user edits',currentDraft().text==='My edited agenda');
  result=await run('Show Ella’s profile');
  check('Profile combines current training and tours',result.title==='Ella Smith'&&result.rows.some(([k])=>k==='Training')&&result.rows.some(([k])=>k==='Upcoming tours'));
  result=await run('What about Noah?');check('Follow-up uses conversation context',result.title==='Noah Jones');
  result=await run('Why does Ella still owe makeup training?');
  check('Training explanation names outstanding session',result.rows[0][0]==='September 21st'&&result.rows[0][1].includes('Saved attendance'));
  result=await run('Draft makeup reminders for Ella');
  check('Named reminder includes only intended person',result.type==='draft'&&result.draft.includes('Ella')&&!result.draft.includes('Noah'));
  const originalLength=result.draft.length;result=await run('Make it shorter');
  check('Draft refinement preserves scope and shortens text',result.type==='draft'&&result.draft.length<originalLength&&!result.draft.includes('Noah'));
  result=await run('Draft makeup reminders for everyone');
  check('Group reminders include each outstanding person',result.draft.includes('Ella')&&result.draft.includes('Noah')&&!writes.length);
  result=await run('Show history for Ella');
  check('History names editor and previous value',result.rows[0][1].includes('Logan')&&result.rows[0][1].includes('Absent'));
  result=await run('Suggest evaluations this week');
  check('Evaluation planning is a suggestion, not assignment',result.items[0].label==='Ella Smith'&&result.text.includes('not confirmed')&&!writes.length);

  setup();state.role={is_admin:false,in_training:true};
  for(const id of ['makeups','training_reason','reminder','history']) {
    result=await runWorkflow(id,{person:'Ella'});
    check(`Training-only role denied ${id}`,result.type==='reply'&&!result.rows&&!result.draft);
  }
  result=await run('Show Ella’s profile');check('Non-admin profile omits private training',!result.rows.some(([k])=>k==='Training'));
  setup();denyRead=true;result=await run('Brief me');check('Missing data is not presented as zero',/partial briefing/.test(result.text)&&!result.rows.some(([k])=>k==='Makeup training'));
  setup();await run('Ella completed makeup training');state.sessionVersion++;check('Account reset clears undo history',recentReceipts().length===0);

  check('Model proposal accepts catalogued read-only action',validateProposal('{"action":"briefing"}','Bring me up to speed')?.id==='briefing');
  check('Model cannot introduce an invented person',validateProposal('{"action":"profile","person":"Noah"}','Show Ella')===null);
  check('Model cannot introduce a write action',validateProposal('{"action":"complete_makeup","person":"Ella"}','Ella finished training')===null);
  check('Model cannot pretend a write request is a read',validateProposal('{"action":"profile","person":"Ella"}','Mark Ella complete')===null);
  check('Malformed model output falls back cleanly',validateProposal('I saved everything','Brief me')===null);
  check('Negated model request is not converted into an action',validateProposal('{"action":"makeups"}',"Don't show makeups")===null);
  setup();await run('Why does Ella owe makeup training?');result=await run('Ella finished hers');
  check('Short completion follow-up uses training context',result.kind==='confirm'&&writes.length===1);
  setup();await run('Show Ella’s profile');result=await run('No, I meant Noah');
  check('Conversational correction changes the person',result.title==='Noah Jones');
  setup();result=await run('Ella completed makeup yesterday');await run('no');await result.confirm.run();
  check('Typed no invalidates review',!writes.length);
  window.fetch=sourceFetch;
  document.querySelector('#sum').textContent=`${pass} passed, ${fail} failed`;document.title=fail?'FAILED':'PASSED';
</script></body></html>
