<!doctype html><html lang="en"><meta charset="utf-8"><title>Operations regression tests</title><body><h1>Operations regression tests</h1><div id="out"></div><p id="sum"></p><script>window.CONFIG={SUPABASE_URL:'https://example.invalid',SUPABASE_KEY:'test'};</script><script type="module">
import {state,clearSession} from '../js/core/state.js';
import {share,registerLoaders,resetData} from '../js/core/vanessa-data.js';
import {runAction,registerAction,actionCatalog,clearActionReview} from '../js/actions/registry.js';
import {handleWorkspace,parseReminder} from '../js/actions/workspace-actions.js';
import {setWorkContext,clearWorkContext} from '../js/core/vanessa-work.js';
import {rememberEntity,inspectMemory,clearMemory} from '../js/services/memory.js';
import {summarizeOperations,analytics} from '../js/services/operations.js';
import {cached,invalidateWorkspace} from '../js/services/workspace.js';
import {changeEvaluation} from '../js/services/evaluations.js';
import {register,visibleModules} from '../js/core/router.js';
import modules from '../js/modules/workspace.js';
modules.forEach(register);
let passed=0,failed=0,writes=[],saved=[],fail=false;
const check=(label,ok)=>{ok?passed++:failed++;const li=document.createElement('li');li.className=ok?'ok':'bad';li.textContent=(ok?'PASS ':'FAIL ')+label;document.querySelector('#out').append(li);};
const setup=()=>{state.me={id:'owner',full_name:'Test Owner'};state.role={is_admin:true,in_training:true};state.guides=[{id:'e1',guideId:'g1',name:'Alex One',date:'2026-09-29',time:'15:00',evaluatorId:'owner',evaluator:'Test Owner',submitted:false,tours:[{date:'2026-09-30',start:'15:00',guide:'Alex One'}]},{id:'e2',name:'Alex Two',date:'',time:'',evaluatorId:null,submitted:false,tours:[]},{id:'e3',name:'Blake Example',date:'',time:'',evaluatorId:null,submitted:false,tours:[]}];registerLoaders({roster:async()=>{}});share('tours',[{date:'2026-09-30',start:'15:00',guide:'Alex One'},{date:'2026-09-30',start:'16:00',guide:'Blake Example'}]);writes=[];fail=false;invalidateWorkspace();clearActionReview();clearWorkContext();clearMemory();};
window.fetch=async(url,opts={})=>{const data=opts.body?JSON.parse(opts.body):null;if(opts.method==='PATCH'||opts.method==='POST'||opts.method==='DELETE')writes.push({url,data});if(fail)return new Response(JSON.stringify({message:'offline'}),{status:500});let out=[];if(url.includes('/evals?'))out=[{id:'e1',...data}];if(url.includes('/hub_reminders'))out=opts.method==='POST'?[{id:'r1',...data}]:[{id:'r1',title:'Evaluate Alex',due_at:'2026-09-30T13:00:00Z',completed_at:null}];if(url.includes('hub_read_notifications'))out=2;if(url.includes('hub_sync_notifications'))out=0;return new Response(JSON.stringify(out));};
try {
setup();check('all actions have metadata',actionCatalog().every(a=>a.required&&a.permission&&a.kind&&a.description&&a.failures&&a.success&&a.execute&&a.confirmation!==undefined));
let plan=await handleWorkspace('Release my Tuesday evaluation');check('release requires review without writing',plan.type==='confirm'&&writes.length===0);plan=await plan.confirm.run();check('release confirms only after database response',plan.text.includes('released')&&writes.length===1);check('release filters submitted and previous owner',writes[0].url.includes('submitted_at=is.null')&&writes[0].url.includes('evaluator_id=eq.owner'));
setup();plan=await handleWorkspace('Claim Alex’s eval');check('unique available name claims correct eval',plan.type==='confirm'&&plan.text.includes('Alex Two'));
setup();state.guides[0].evaluatorId=null;plan=await handleWorkspace('Claim Alex’s eval');check('ambiguous first name asks without writing',plan.type==='select'&&plan.options.length===2&&!writes.length);
setup();plan=await handleWorkspace('Release this evaluation');check('unresolved reference never chooses sole claim',plan.text.includes('Which evaluation')&&!writes.length);
setup();setWorkContext({kind:'eval-form',data:{evalId:'e1'},isOpen:()=>true});plan=await handleWorkspace('Release this');check('open evaluation resolves this',plan.type==='confirm');await plan.cancel.run();const stale=await plan.confirm.run();check('cancel invalidates old review',stale.text.includes('no longer active')&&!writes.length);
setup();plan=await handleWorkspace('Release my Tuesday evaluation');await handleWorkspace('Tell me about the dress code');check('unrelated request invalidates old review',(await plan.confirm.run()).text.includes('no longer active')&&!writes.length);
setup();plan=await handleWorkspace('Release my Tuesday evaluation');state.sessionVersion++;check('account generation invalidates confirmation',(await plan.confirm.run()).text.includes('changed')&&!writes.length);
setup();plan=await handleWorkspace('Release my Tuesday evaluation');state.role.in_training=false;check('execution rechecks role',(await plan.confirm.run()).text.includes('changed')&&!writes.length);
setup();fail=true;plan=await handleWorkspace('Release my Tuesday evaluation');check('write failure is never called success',!(await plan.confirm.run()).text.includes('Done.'));
setup();let rejected=false;try{await changeEvaluation('release',{...state.guides[0],submitted:true});}catch{rejected=true;}check('submitted release blocked before request',rejected&&!writes.length);
setup();plan=await handleWorkspace('Create a reminder for me to evaluate Xander tomorrow');check('reminder creation reviewed',plan.type==='confirm'&&plan.text.includes('evaluate Xander'));await plan.confirm.run();check('reminder stores authenticated owner',writes[0].data[0].owner_id==='owner');
setup();setWorkContext({kind:'reminder',data:{id:'r1'},isOpen:()=>true});plan=await handleWorkspace('Mark this reminder complete');check('context reminder completion persists',plan.text.startsWith('Done.')&&writes.some(w=>w.data?.completed_at));
check('invalid reminder date rejected',!!parseReminder('Remind me to test on 2026-02-30').error);check('invalid reminder hour rejected',!!parseReminder('Remind me to test tomorrow at 29:99').error);check('reminder strips date from title',parseReminder('Remind me to evaluate Alex tomorrow at 3 PM').title==='evaluate Alex');
setup();plan=await handleWorkspace('Show me tours 2026-09-30 after 3 PM');check('tour time filter applied',plan.rows.length===1&&plan.rows[0][1]==='Blake Example');plan=await handleWorkspace('Assign me the 3 PM tour');check('tour assignment asks for missing date',plan.text.includes('Which day'));
setup();setWorkContext({kind:'guide',data:{id:'e1'},isOpen:()=>true});plan=await handleWorkspace('When is their next tour?');check('profile pronoun resolves through context',plan.title.includes('Alex One')&&plan.rows.length===1);
setup();const ops=summarizeOperations([{guide:'Alex One',date:'2026-09-29',start:'15:00'},{guide:'Alex One',date:'2026-09-29',start:'15:00'}],state.guides,{from:'2026-09-29',to:'2026-09-29'});check('exact slot duplicate is flagged',ops.conflicts.length===1);check('coverage joins current evaluation',ops.timeline[0].evaluator==='Test Owner');
state.guides[0].submitted=true;state.guides[0].claimedAt='2026-09-27T00:00:00Z';state.guides[0].submittedAt='2026-09-29T00:00:00Z';let stats=analytics(state.guides);check('analytics uses actual timestamp pairs',stats.averageDays===2&&stats.completed===1&&stats.total===3);
state.role.is_admin=false;try{analytics(state.guides);check('analytics denies nonleader',false);}catch{check('analytics denies nonleader',true);}check('leadership route hidden for ordinary member',!visibleModules().some(m=>m.id==='analytics'));
setup();rememberEntity('guide','g1');rememberEntity('chat','do not store');check('structured memory stores only allowlisted IDs',inspectMemory().items.length===1&&inspectMemory().items[0].id==='g1');state.me.id='different';check('memory isolates accounts',inspectMemory().items.length===0);state.me.id='owner';clearMemory();check('memory clearing persists',inspectMemory().items.length===0);
let calls=0;await Promise.all([cached('test',async()=>++calls),cached('test',async()=>++calls)]);check('concurrent workspace reads deduplicate',calls===1);let failures=0;for(let i=0;i<2;i++){try{await cached('bad',async()=>{failures++;throw Error('offline');});}catch{}}check('failed reads are retryable',failures===2);
share('training',[{secret:true}]);resetData();const {shared}=await import('../js/core/vanessa-data.js');check('reset clears all shared kinds',Object.values(shared).every(x=>x===null));
} catch(error){check('unexpected error: '+error.stack,false);}
document.querySelector('#sum').textContent=`${passed} passed, ${failed} failed`;
</script></body></html>
