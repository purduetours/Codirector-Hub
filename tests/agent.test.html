<!doctype html><html lang="en"><meta charset="utf-8"><title>Vanessa agent tests</title><body><div id="out"></div><p id="sum"></p><script>window.CONFIG={SUPABASE_URL:'https://example.invalid',SUPABASE_KEY:'test'};</script><script type="module">
import {state} from '../js/core/state.js';
import {share} from '../js/core/vanessa-data.js';
import {callTool,approveTool,toolCatalog} from '../js/agent/tools.js';
import {handleAgent,reviewTask,resetAgent,taskSnapshot,dailyBriefing} from '../js/agent/planner.js';
import {parseTimeWindow,localInstant} from '../js/agent/time.js';
import {agentContext,onAgentProgress} from '../js/agent/context.js';
import {attachOpportunities} from '../js/services/agent-data.js';
import {visibleAttention,muteAttention} from '../js/agent/attention.js';
import {invalidateWorkspace} from '../js/services/workspace.js';
let passed=0,failed=0,writes=[],reads=[],failReminder=false,failRelease=false,saved=new Map(),records=[],directory=[];
const check=(label,ok)=>{ok?passed++:failed++;const li=document.createElement('li');li.className=ok?'ok':'bad';li.textContent=(ok?'PASS ':'FAIL ')+label;document.querySelector('#out').append(li);};
const row=(id,name,owner=null,date=null)=>({id,guide_id:'g'+id,first_name:name.split(' ')[0],last_name:name.split(' ')[1],full_name:name,needs_eval:true,evaluator_id:owner,tour_date:date,tour_time:date?'14:00:00':null});
function setup(){resetAgent();state.me={id:'owner',full_name:'Test Owner'};state.role={is_admin:true,in_training:true};state.term={id:'current'};writes=[];reads=[];saved.clear();failReminder=failRelease=false;records=[row('e1','Alex One','owner','2026-10-02'),row('e2','Blake Two')];state.guides=records.map(r=>({id:r.id,evaluatorId:r.evaluator_id,date:r.tour_date||'',time:(r.tour_time||'').slice(0,5)}));directory=records.map(r=>({id:r.guide_id,first_name:r.first_name,last_name:r.last_name,full_name:r.full_name}));share('tours',[{date:'2026-10-02',start:'14:00',guide:'Alex One'},{date:'2026-10-02',start:'15:00',guide:'Blake Two'}]);invalidateWorkspace();}
window.fetch=async(url,opts={})=>{const u=new URL(url),q=u.searchParams;reads.push(url);let out=[];const p=opts.body?JSON.parse(opts.body):{};
if(u.pathname.endsWith('/eval_roster')){out=records.filter(r=>{if(q.get('id')&&!q.get('id').slice(4,-1).split(',').includes(r.id))return false;if(q.get('evaluator_id')==='is.null'&&r.evaluator_id)return false;if(q.get('evaluator_id')?.startsWith('eq.')&&r.evaluator_id!==q.get('evaluator_id').slice(3))return false;if(q.get('submitted_at')==='is.null'&&r.submitted_at)return false;if(q.get('full_name')&&!r.full_name.toLowerCase().includes(q.get('full_name').slice(7,-1).toLowerCase()))return false;for(const x of q.getAll('tour_date')){if(!r.tour_date||x.startsWith('gte.')&&r.tour_date<x.slice(4)||x.startsWith('lte.')&&r.tour_date>x.slice(4)||x.startsWith('lt.')&&r.tour_date>=x.slice(3))return false;}return true;}).slice(+(q.get('offset')||0),+(q.get('offset')||0)+ +(q.get('limit')||100));}
if(u.pathname.endsWith('/guides'))out=directory;
if(u.pathname.endsWith('/hub_agent_actions'))out=[...saved.values()];
if(u.pathname.endsWith('/hub_reminders'))out=[{id:'r1',title:'Call guide',due_at:'2026-01-01T13:00:00Z',completed_at:null}];
if(u.pathname.endsWith('/rpc/hub_sync_notifications'))out=0;
if(u.pathname.endsWith('/rpc/hub_agent_analytics'))out={workload:[],sampleSize:0,truncated:false};
if(u.pathname.endsWith('/rpc/hub_agent_action')){writes.push(p);if(failReminder&&p.p_action==='reminder.create'||failRelease&&p.p_action==='evaluation.release')return new Response(JSON.stringify({message:'network unavailable'}),{status:500});if(saved.has(p.p_request_id))out=saved.get(p.p_request_id);else {out={id:'receipt-'+saved.size,action:p.p_action,result:{id:p.p_params.eval_id||'r1',...(p.p_action.startsWith('evaluation.')?{evaluator_id:p.p_action==='evaluation.claim'?'owner':null,tour_date:p.p_params.date||null,tour_time:p.p_params.time||null,claimed_at:'2026-09-29T14:00:00Z'}:{})},summary:p.p_action+' saved',created_at:'2026-09-29T14:00:00Z'};saved.set(p.p_request_id,out);}}
return new Response(JSON.stringify(out));};
try{
setup();const now=new Date('2026-09-29T14:30:00Z');
for(const [q,from,to] of [['today','2026-09-29','2026-09-29'],['tomorrow','2026-09-30','2026-09-30'],['Friday','2026-10-02','2026-10-02'],['next Friday','2026-10-09','2026-10-09'],['this week','2026-09-29','2026-10-04'],['next week','2026-10-05','2026-10-11'],['end of the month','2026-09-30','2026-09-30']]){const w=parseTimeWindow(q,now);check('date '+q,w.from===from&&w.to===to);}
check('before noon',parseTimeWindow('tomorrow before noon',now).before==='12:00');check('after ambiguous 2 clarifies',!!parseTimeWindow('tomorrow after 2',now).error);check('conflicting dates clarify',!!parseTimeWindow('today tomorrow',now).error);check('time range respects both bounds',parseTimeWindow('after 2 PM before 5 PM',now).before==='17:00');check('inverted time bounds clarify',!!parseTimeWindow('after 5 PM before noon',now).error);check('invalid date rejected',!!parseTimeWindow('2026-02-30',now).error);check('later today uses Purdue clock',parseTimeWindow('later today',now).after==='10:30');
check('timezone independent instant',localInstant('2026-10-02','14:00')==='2026-10-02T18:00:00.000Z');for(const [date,time] of [['2026-03-08','02:30'],['2026-11-01','01:30']]){try{localInstant(date,time);check('DST ambiguity '+date,false);}catch{check('DST ambiguity '+date,true);}}
check('typed metadata for all tools',toolCatalog().length>=14&&toolCatalog().every(t=>t.description&&t.parameters&&t.kind));
check('unknown parameter rejected',!(await callTool('evaluations',{owner_id:'other'})).ok);check('invalid limit rejected',!(await callTool('evaluations',{limit:1000})).ok);check('write without review blocked',!(await callTool('reminder.complete',{id:'r1'})).ok&&!writes.length);check('forged capability blocked',!(await callTool('reminder.complete',{id:'r1'},{approval:{},requestId:'fake'})).ok);
state.role.in_training=false;check('training read permission checked',!(await callTool('evaluations')).ok);state.role.is_admin=false;check('leadership tool permission checked',!(await callTool('analytics')).ok);setup();
let plan=await handleAgent('Who needs evaluated?');check('outstanding recipe returns live cards',plan.cards.length===2);check('follow-up stores IDs only',agentContext().ids.join(',')==='e1,e2'&&!agentContext().cards);plan=await handleAgent('Which ones are working 2026-10-02?');check('follow-up joins selected guides',plan.cards.length===2);plan=await handleAgent('Show me the earliest tour');check('earliest follows narrowed tour context',plan.cards.length===1&&plan.cards[0].title==='Alex One');
setup();directory.push({id:'gx',first_name:'Blake',last_name:'Three',full_name:'Blake Three'});const joined=await attachOpportunities([{id:'e2',guideId:'ge2',name:'Blake Two',first:'Blake',last:'Two'}],[{guide:'Blake T.'}]);check('abbreviation resolves against complete directory',joined[0].evaluation===null);
setup();directory.push({...directory[1],id:'duplicate'});check('duplicate full names do not resolve from a filtered subset',(await attachOpportunities([{id:'e2',guideId:'ge2',name:'Blake Two'}],[{guide:'Blake Two'}]))[0].evaluation===null);
setup();plan=await handleAgent('Claim Blake’s evaluation');check('single claim uses reviewed agent tool',plan.type==='confirm'&&!writes.length);await plan.confirm.run();check('single claim writes an audited RPC',writes[0]?.p_action==='evaluation.claim');check('saved claim refreshes shared roster state',state.guides.find(g=>g.id==='e2').evaluatorId==='owner'&&state.loadedAt===null);
setup();plan=await handleAgent('Remind me tomorrow to check tours');check('conversational reminder reviewed in Purdue time',plan.type==='confirm'&&plan.rows[0][1].includes('Purdue time'));
setup();plan=await handleAgent('Release Alex evaluation and delete my reminders');check('unsupported dependent changes do not partially execute',plan.type==='reply'&&!writes.length);
setup();plan=await handleAgent('Release Nobody evaluation Friday');check('date never discards explicit guide name',plan.type==='reply'&&!writes.length);
setup();plan=await handleAgent('Find everyone who hasn’t been evaluated recently');plan=await handleAgent('14 days');check('recency clarification queries bounded submitted dates',plan.type==='summary'&&reads.some(u=>u.includes('or=(submitted_at.is.null')));
setup();records.push(row('e3','Alex Other','owner','2026-10-02'));plan=await handleAgent('Release my Friday evaluation and remind me tomorrow to pick another one');check('multiple Friday evaluations clarify without mutation',plan.type==='select'&&plan.options.length===2&&!writes.length);
setup();let progress=[];const unsub=onAgentProgress(s=>{if(s)progress.push(s);});plan=await handleAgent('Release my Friday evaluation and remind me tomorrow to pick another one');check('multi-step task reviewed first',plan.type==='confirm'&&plan.rows.length===2&&!writes.length);failReminder=true;let result=await plan.confirm.run();check('partial failure reports saved first step',result.title==='Partly completed'&&writes.length===2&&taskSnapshot().steps[0].status==='completed');const oldId=writes[1].p_request_id;failReminder=false;result=await result.actions.find(a=>a.label==='Retry unfinished step').run();check('retry skips completed release',writes.filter(w=>w.p_action==='evaluation.release').length===1);check('retry reuses failed request identity',writes[2].p_request_id===oldId&&result.title==='Done');check('progress corresponds to actual operations',progress.some(s=>s.includes('Release'))&&progress.some(s=>s.includes('Create')));unsub();
setup();plan=await handleAgent('Release my Friday evaluation and remind me tomorrow to pick another one');failRelease=true;await plan.confirm.run();check('failed prerequisite prevents reminder',writes.length===1&&writes[0].p_action==='evaluation.release');
setup();plan=await handleAgent('Release my Friday evaluation and remind me tomorrow to pick another one');await plan.cancel.run();await plan.confirm.run();check('cancelled review cannot write',!writes.length);
setup();plan=await handleAgent('Release my Friday evaluation and remind me tomorrow to pick another one');await handleAgent('Tell me about attire');await plan.confirm.run();check('unrelated request invalidates review',!writes.length);
setup();plan=await handleAgent('Release my Friday evaluation and remind me tomorrow to pick another one');state.sessionVersion++;await plan.confirm.run();check('account generation invalidates plan',!writes.length);
setup();plan=await handleAgent('Release my Friday evaluation and remind me tomorrow to pick another one');state.role.in_training=false;await plan.confirm.run();check('role checked again at execution',!writes.length);
setup();const args={id:'r1'},id='10000000-0000-4000-8000-000000000001',approval=approveTool('reminder.complete',args,id);state.sessionVersion++;check('capability cannot cross account generation',!(await callTool('reminder.complete',args,{approval,requestId:id})).ok);
setup();muteAttention('test',1);check('snooze persists',!visibleAttention('test'));state.me.id='other';check('snooze is account scoped',visibleAttention('test'));setup();plan=await dailyBriefing();check('briefing has real reminder action card',plan.cards.some(c=>c.title==='Call guide'));plan=await handleAgent('Take care of the first one');check('first briefing action requires review',plan.type==='confirm'&&!writes.length);
setup();plan=await handleAgent('Vanessa action history');check('empty history is honest',plan.text.includes('No saved'));state.me=null;check('signed out tools deny reads',!(await callTool('currentUser')).ok);
}catch(e){check('Unexpected: '+e.stack,false);}
document.querySelector('#sum').textContent=`${passed} passed, ${failed} failed`;
</script></body></html>
