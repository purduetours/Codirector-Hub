<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin operations tests</title>
<!--
  Front-end checks for the administration features, using the real modules with
  nothing talking to a database: CSV reading, settings parsing, Vanessa's
  administrative requests and who may make them, and what the Action Center
  produces for each role.

  The database half (guards, audit, semester start and its preview) is tested
  against a real Postgres in supabase/tests/admin-operations.test.mjs.

  Serve the project folder and open this page, e.g.
    python3 -m http.server 8000   then   http://localhost:8000/tests/admin-ops.test.html
-->
<style>
  body { font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; margin: 32px; color: #17150f; background: #f5f2eb; }
  .ok { color: #2e7d4f; } .bad { color: #a3222a; font-weight: 700; } li { margin: 3px 0; } #sum { font-weight: 700; margin-top: 16px; }
</style>
</head>
<body>
<h1>Admin operations tests</h1>
<ul id="out"></ul><p id="sum"></p>
<script>window.CONFIG = { SUPABASE_URL: 'https://example.invalid', SUPABASE_KEY: 'test', TERM_LABEL: 'Fall 2026' };
  // A database that has not had the admin setup run answers its functions with 404, like Supabase does.
  window.fetch = async url => String(url).includes('/rpc/')
    ? new Response(JSON.stringify({ message: 'Could not find the function public.admin_health in the schema cache' }), { status: 404, headers: { 'content-type': 'application/json' } })
    : new Response('[]', { status: 200, headers: { 'content-type': 'application/json' } });</script>
<script type="module">
  import { state } from '../js/core/state.js';
  import { parseCsv, readTable, pick } from '../js/core/csv.js';
  import { sheetId } from '../js/modules/settings.js';
  import { adminIntent, runAdmin } from '../js/core/vanessa-admin.js';
  import { getActions, refreshActions, resetActions, LEVELS } from '../js/core/actioncenter.js';
  import { trainingIntent, runTraining, pastDay } from '../js/core/vanessa-training.js';
  import { attClass, audienceText, byPerson } from '../js/modules/train-data.js';
  import { matchIdentity, indexMappings, nameKey, normName } from '../js/core/identity.js';
  import { suggestMatches, priorityBand } from '../js/core/evalmatch.js';
  import { suggestMapping, headerRowIndex, headerSignature, parseDate, parseTime, tableToRecords, gridToRecords, parseSheetLink, matchRecords } from '../js/core/sources.js';

  let pass = 0, fail = 0;
  const out = document.getElementById('out');
  const check = (label, ok, detail = '') => { ok ? pass++ : fail++;
    out.insertAdjacentHTML('beforeend', `<li class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'} ${label}${detail ? ` — ${detail}` : ''}</li>`); };

  /* ------------------------------------------------------------------ CSV */
  check('csv: quoted commas, doubled quotes, BOM and CRLF', JSON.stringify(parseCsv('﻿a,b\r\n"x, y","say ""hi"""\r\n\r\nlast,row')) === JSON.stringify([['a', 'b'], ['x, y', 'say "hi"'], ['last', 'row']]));
  const t = readTable('Full Name,E-mail,ROLE\nJane Doe,jane@purdue.edu,Training Committee\n');
  check('csv: headers are matched forgivingly', pick(t.records[0], 'fullname', 'name') === 'Jane Doe' && pick(t.records[0], 'email') === 'jane@purdue.edu', JSON.stringify(t.headers));
  check('csv: header-only file has no records', readTable('Name,Email\n').records.length === 0);

  /* -------------------------------------------------------------- settings */
  const ID = '1XIfi_T4G1tkc_8D28cQWXUtCgk7Cb-BuyLrEvhfAzno';
  check('settings: a sheet id is pulled out of a full link', sheetId(`https://docs.google.com/spreadsheets/d/${ID}/edit#gid=0`) === ID);
  check('settings: a bare id is accepted', sheetId(ID) === ID);
  check('settings: nonsense is refused', sheetId('hello') === '' && sheetId('https://example.com') === '');

  /* ------------------------------------------------- Vanessa: what she hears */
  const heard = q => adminIntent(q)?.id || null;
  check('vanessa: "Deactivate John" is an archive request', heard('Deactivate John') === 'archive' && adminIntent('Deactivate John').who === 'John');
  check('vanessa: restore / bring back', heard('bring back Ella') === 'restore' && heard('restore Noah Kim') === 'restore');
  check('vanessa: add with an email', adminIntent('add Alex Kim, alex@purdue.edu as Training Committee')?.email === 'alex@purdue.edu' && adminIntent('add Alex Kim, alex@purdue.edu as Training Committee').role === 'Training Committee');
  check('vanessa: add guide', adminIntent('add guide Alex Kim, alex@purdue.edu')?.guide === true);
  check('vanessa: add without an email asks for one', heard('Add Alex to the Fall roster') === 'add_help');
  check('vanessa: needs attention / overdue', heard('what is overdue?') === 'needs' && heard('what needs my attention') === 'needs' && adminIntent('what is overdue?').overdue);
  check('vanessa: ordinary requests are not mistaken for admin ones',
    ['remove my claim on Ella', 'archive the eval for Noah', 'who is touring tomorrow?', 'brief me', 'claim noah', 'draft makeup reminders'].every(q => !adminIntent(q)), ['remove my claim on Ella', 'archive the eval for Noah'].map(heard).join());

  /* --------------------------------------- Vanessa: who may ask (permissions) */
  const roles = {
    guide:    { is_admin: false, in_training: false, in_recruitment: false },
    training: { is_admin: false, in_training: true,  in_recruitment: false },
    recruit:  { is_admin: false, in_training: false, in_recruitment: true  },
    admin:    { is_admin: true,  in_training: true,  in_recruitment: true  }
  };
  const setRole = k => { state.role = { name: k, ...roles[k] }; state.me = { id: 'me', full_name: 'Me', email: 'me@purdue.edu', role: k }; state.guides = []; state.settings = {}; resetActions(); };

  for (const k of ['guide', 'training', 'recruit']) {
    setRole(k);
    const NO = "That tool isn't available for your account.";
    const refused = await Promise.all(['archive', 'restore', 'add', 'add_help'].map(async id =>
      (await runAdmin({ id, who: 'Ella', name: 'Ella Fox', email: 'e@purdue.edu', role: 'x' }))?.text === NO));
    check(`${k}: Vanessa refuses every administrative write`, refused.every(Boolean), refused.join());
  }
  setRole('admin'); state.settings = { 'vanessa.adminActions': false };
  const off = await runAdmin({ id: 'archive', who: 'Ella' });
  check('admin: the Settings switch turns her admin actions off', /switched off/i.test(off?.text || ''), off?.text);
  state.settings = {};

  /* --------------------------------------------------------- Action Center */
  const today = new Date(); const iso = d => { const x = new Date(today); x.setDate(x.getDate() + d); return x.toISOString().slice(0, 10); };
  const guides = [
    { id: 'e1', name: 'Ann One',  status: 'claimed', evaluatorId: 'me', date: iso(-2), time: '14:00', rank: 3, evaluator: 'Me' },
    { id: 'e2', name: 'Ben Two',  status: 'claimed', evaluatorId: 'me', date: iso(2),  time: '10:00', rank: 3, evaluator: 'Me' },
    { id: 'e3', name: 'Cy Three', status: 'claimed', evaluatorId: 'me', date: '',       time: '',      rank: 3, evaluator: 'Me' },
    { id: 'e4', name: 'Dee Four', status: 'open',    evaluatorId: null, date: '',       time: '',      rank: 1 },
    { id: 'e5', name: 'Eve Five', status: 'submitted', evaluatorId: 'x', date: iso(-5), time: '', rank: 3, evaluator: 'Zed' },
    { id: 'e6', name: 'Fay Six',  status: 'claimed', evaluatorId: 'x', date: iso(-3), time: '', rank: 3, evaluator: 'Zed' }
  ];
  const levels = list => list.map(a => `${a.level}:${a.id.split(':')[0]}`).join(' ');

  setRole('training'); state.guides = guides; await refreshActions({ force: true });
  let l = getActions();
  check('actions (training): an overdue evaluation is urgent and listed first', l[0]?.level === 'urgent' && /Overdue/.test(l[0].title), levels(l));
  check('actions (training): upcoming and undated evaluations appear', l.some(a => a.level === 'upcoming') && l.some(a => a.id.startsWith('eval-undated')), levels(l));
  check('actions (training): unclaimed top-priority guides are flagged', l.some(a => a.id.startsWith('eval-unclaimed')));
  check('actions (training): admin-only items are absent', !l.some(a => /eval-review|eval-late|makeups|setup-missing|no-term|signups/.test(a.id)), levels(l));

  setRole('admin'); state.guides = guides; await refreshActions({ force: true });
  l = getActions();
  check('actions (admin): review queue and committee-wide overdue appear', l.some(a => a.id.startsWith('eval-review')) && l.some(a => a.id.startsWith('eval-late')), levels(l));
  check('actions (admin): a missing admin setup is reported plainly, never as a stack trace', l.some(a => a.id === 'setup-missing' && !/Error|at /.test(a.detail)), levels(l));

  setRole('guide'); state.guides = guides; await refreshActions({ force: true });
  check('actions (guide): no evaluation or admin items at all', getActions().every(a => !/^eval|^iv-|^desk|^makeups|^setup|^no-term/.test(a.id)), levels(getActions()));

  check('actions: only Urgent and Needs action count toward the badge', LEVELS.urgent.badge && LEVELS.action.badge && !LEVELS.upcoming.badge && !LEVELS.info.badge);


  /* ------------------------------------------------------------ identity */
  const G = [
    { id: 'g1', first_name: 'Logann', last_name: 'Tuttle', email: 'logann@purdue.edu' },
    { id: 'g2', first_name: 'Nicholas (Nick)', last_name: 'Steingraeber' },
    { id: 'g3', first_name: 'Nicholas', last_name: 'Stromberg' },
    { id: 'g4', first_name: 'Ben', last_name: 'Smith' }, { id: 'g5', first_name: 'Ben', last_name: 'Smyth' },
    { id: 'g6', first_name: 'María', last_name: 'García' }
  ];
  const mi = (rec, kind = 'majors', maps = []) => matchIdentity(rec, { kind, guides: G, mappings: indexMappings(maps) });
  check('identity: email beats everything', mi({ name: 'Someone Else', email: 'LOGANN@purdue.edu' }).guideId === 'g1' && mi({ name: 'x', email: 'logann@purdue.edu' }).basis === 'email');
  check('identity: exact normalised name (accents, case, marks)', mi({ name: 'maria garcia' }).guideId === 'g6' && mi({ name: 'LOGANN  TUTTLE*' }).guideId === 'g1' && mi({ name: 'Nick Steingraeber' }).guideId === 'g2');
  check('identity: "Logan Tuttle" is only a suggestion, never a link', (r => r.basis === 'fuzzy' && !r.guideId && r.candidates[0].id === 'g1')(mi({ name: 'Logan Tuttle' })));
  check('identity: "L. Tuttle" suggests, never links', (r => !r.guideId && r.candidates[0]?.id === 'g1')(mi({ name: 'L. Tuttle' })));
  check('identity: "Nick Str." goes to Stromberg, not Steingraeber', (r => !r.guideId && r.candidates.length === 1 && r.candidates[0].id === 'g3')(mi({ name: 'Nick Str.' })));
  check('identity: two possible people are both offered', mi({ name: 'Ben S.' }).candidates.length === 2);
  check('identity: strangers match nobody', mi({ name: 'Zed Nobody' }).basis === 'none');
  const saved = [{ external_key: nameKey('Logan Tuttle'), source_kind: 'majors', guide_id: 'g1', confirmed: true }];
  check('identity: a saved answer links, and is not asked again', mi({ name: 'Logan Tuttle' }, 'majors', saved).basis === 'saved' && mi({ name: 'Logan Tuttle' }, 'majors', saved).guideId === 'g1');
  check('identity: an answer given for one source helps the others (alias)', mi({ name: 'Logan Tuttle' }, 'tour_schedule', saved).basis === 'alias');
  check('identity: an unconfirmed guess is not treated as an answer', mi({ name: 'Logan Tuttle' }, 'majors', [{ ...saved[0], confirmed: false }]).basis === 'fuzzy');
  check('identity: "not one of ours" is remembered', mi({ name: 'Logan Tuttle' }, 'majors', [{ external_key: nameKey('Logan Tuttle'), source_kind: 'majors', ignored: true, confirmed: true }]).basis === 'ignored');
  check('identity: a saved link to a guide that no longer exists is not trusted', mi({ name: 'Zed' }, 'majors', [{ external_key: nameKey('Zed'), source_kind: 'majors', guide_id: 'gone', confirmed: true }]).basis === 'none');
  check('identity: a stable external id comes first', mi({ name: 'Whoever', extId: 'P123' }, 'majors', [{ external_key: 'id:p123', source_kind: 'majors', guide_id: 'g4', confirmed: true }]).guideId === 'g4');

  /* -------------------------------------------------------------- sources */
  check('sources: link -> id and tab', (r => r.id === ID && r.gid === '12')(parseSheetLink(`https://docs.google.com/spreadsheets/d/${ID}/edit?gid=12#gid=12`)));
  const hdr = ['First Name', 'Last Name', 'Major(s)', 'Email'];
  check('sources: columns recognised from the real Tour Guides by Major headers', (m => m.first === 'First Name' && m.last === 'Last Name' && m.major === 'Major(s)' && m.email === 'Email' && !m.name)(suggestMapping('majors', hdr)));
  check('sources: different headings still recognised', (m => m.name === 'Student Name' && m.date === 'Tour Date' && m.start === 'Start' && m.evaluator === 'Evaluator')(suggestMapping('tour_schedule', ['Student Name', 'Tour Date', 'Start', 'Evaluator'])));
  check('sources: the header row is found below a title', headerRowIndex([['Fall 2026 majors', '', ''], ['', '', ''], ['First Name', 'Last Name', 'Email'], ['A', 'B', 'a@b.edu']]) === 2);
  check('sources: header signature ignores order and case', headerSignature(['Email', 'First Name']) === headerSignature(['first name', 'EMAIL']));
  check('sources: dates as people write them', parseDate('2026-10-08') === '2026-10-08' && parseDate('10/8/2026') === '2026-10-08' && parseDate('10/8/26') === '2026-10-08' && parseDate('Oct 8', 2026) === '2026-10-08' && parseDate('Thursday 10/8', 2026) === '2026-10-08' && parseDate('September 8th, 2026') === '2026-09-08' && parseDate('soon') === '');
  check('sources: times', parseTime('10:00 AM') === '10:00' && parseTime('2pm') === '14:00' && parseTime('14:30') === '14:30' && parseTime('1:45-2:45') === '13:45' && parseTime('') === '');
  const rows = [['First Name', 'Last Name', 'Major(s)', 'Email'], ['Hunter', 'Lipinski', 'Aerospace', 'hlipinsk@purdue.edu'], ['Hunter', 'Lipinski', 'Aerospace', 'hlipinsk@purdue.edu'], ['', '', '', ''], ['Joey', 'Pelletier', 'Engineering', '']];
  const tr = tableToRecords({ kind: 'majors', rows, map: suggestMapping('majors', hdr), year: 2026 });
  check('sources: a repeated row is read once; keys are stable', tr.records.length === 2 && tr.records[0].key === 'hlipinsk@purdue.edu' && tr.records[1].key === 'name:joey pelletier' && tr.warnings.some(w => /duplicate/.test(w)), JSON.stringify(tr.records.map(r => r.key)));
  const sr = tableToRecords({ kind: 'tour_schedule', rows: [['Guide', 'Date', 'Start'], ['Alli S.', '10/8', '10:00 AM'], ['Alli S.', '10/8', '10:00 AM'], ['Bob', 'soon', '1pm']], map: { name: 'Guide', date: 'Date', start: 'Start' }, year: 2026 });
  check('sources: schedule rows keyed by date, slot and person; unreadable dates reported', sr.records.length === 1 && sr.records[0].key === '2026-10-08|10:00 AM|name:alli s' && sr.records[0].start_time === '10:00' && sr.warnings.some(w => /skipped/.test(w)), JSON.stringify(sr.records[0]));
  check('sources: grid schedule becomes the same record shape', gridToRecords([{ date: '2026-10-08', start: '10:00', slot: '10:00-11:00', guide: 'Alli S.' }]).records[0].identity === 'name:alli s');
  const recs = tr.records.slice(); const counts = matchRecords(recs, 'majors', { guides: G, mappings: indexMappings([]) });
  check('sources: matching summary counts each outcome', counts.review === 2 && counts.auto === 0, JSON.stringify(counts));

  /* -------------------------------------------------- evaluation matching */
  const TODAY = '2026-10-01';
  const eg = (id, name, rank, tours, extra = {}) => ({ id, guideId: 'G' + id, name, status: 'open', rank, priority: rank <= 2 ? 'First Priority to Eval' : 'Third Priority', tours, ...extra });
  const T = (date, start) => ({ date, start, slot: start });
  const evs = [{ id: 'E1', name: 'Taylor', workload: 0 }, { id: 'E2', name: 'Sam', workload: 3 }];
  const m1 = suggestMatches({ today: TODAY, evaluators: evs, guides: [
    eg(1, 'Low Pri', 5, [T('2026-10-08', '10:00')]), eg(2, 'High Pri', 1, [T('2026-10-08', '10:00')]),
    eg(3, 'No Tours', 1, []), eg(4, 'Past Only', 1, [T('2026-09-01', '10:00')]), eg(5, 'Not Eligible', 1, [T('2026-10-09', '10:00')], { tourEligible: false }),
    { ...eg(6, 'Already Claimed', 1, [T('2026-10-08', '10:00')]), status: 'claimed' }] });
  check('evalmatch: only guides who still need an evaluator are considered', m1.needing === 5, String(m1.needing));
  check('evalmatch: High priority is served first (and gets the evaluator with the lightest load)', m1.matches[0].guideName === 'High Pri' && m1.matches[0].evaluatorName === 'Taylor');
  check('evalmatch: nobody is double-booked at the same tour time', m1.matches.length === 2 && new Set(m1.matches.map(m => m.evaluatorId)).size === 2);
  check('evalmatch: no tour / past tour / not eligible are reported, not forced', ['No Tours', 'Past Only', 'Not Eligible'].every(n => m1.unable.some(u => u.guide.name === n)), m1.unable.map(u => u.guide.name).join());
  check('evalmatch: every suggestion carries its reasoning (and states what is not tracked)', m1.matches.every(m => m.reasons.length >= 4 && m.reasons.some(r => /not tracked/.test(r)) && m.reasons.some(r => /scheduled to give a tour/.test(r))));
  const m2 = suggestMatches({ today: TODAY, evaluators: [{ id: 'E1', name: 'Taylor', workload: 0 }], guides: [eg(1, 'A', 1, [T('2026-10-08', '10:00'), T('2026-10-09', '10:00')]), eg(2, 'B', 2, [T('2026-10-08', '10:00'), T('2026-10-10', '10:00')])] });
  check('evalmatch: when the first tour has no free evaluator, a later one is used and flagged', m2.matches.length === 2 && m2.matches[1].conflict && m2.conflicts.length === 1 && m2.matches[1].date === '2026-10-10');
  const m3 = suggestMatches({ today: TODAY, evaluators: [{ id: 'E1', name: 'Taylor', workload: 0 }], busy: new Map([['E1', new Set(['2026-10-08|10:00'])]]), guides: [eg(1, 'A', 1, [T('2026-10-08', '10:00')])] });
  check('evalmatch: an evaluator already booked then is not offered', m3.matches.length === 0 && /booked/.test(m3.unable[0].reason));
  const m4 = suggestMatches({ today: TODAY, evaluators: [{ id: 'E1', name: 'Self', workload: 0 }], guides: [eg(1, 'Self G', 1, [T('2026-10-08', '10:00')], { memberId: 'E1' })] });
  check('evalmatch: nobody evaluates themselves', m4.matches.length === 0);
  const m5 = suggestMatches({ today: TODAY, evaluators: [{ id: 'E1', name: 'Taylor', workload: 0 }, { id: 'E2', name: 'Sam', workload: 0 }], guides: [eg(1, 'A', 1, [T('2026-10-08', '10:00')]), eg(2, 'B', 1, [T('2026-10-09', '10:00')]), eg(3, 'C', 1, [T('2026-10-10', '10:00')]), eg(4, 'D', 1, [T('2026-10-11', '10:00')])] });
  check('evalmatch: work is spread evenly', (c => Math.abs(c.E1 - c.E2) <= 0)(m5.matches.reduce((c, m) => ({ ...c, [m.evaluatorId]: (c[m.evaluatorId] || 0) + 1 }), { E1: 0, E2: 0 })));
  check('evalmatch: priority bands', priorityBand(1) === 'High' && priorityBand(2) === 'High' && priorityBand(3) === 'Normal' && priorityBand(5) === 'Low' && priorityBand(3, false) === 'None');

  /* ------------------------------------ Vanessa: the new canonical-data requests */
  check('vanessa: top priority', adminIntent('Who are the highest-priority evaluations?')?.id === 'top_priority');
  check('vanessa: unresolved problems', adminIntent('Show me unresolved roster problems')?.id === 'issues' && adminIntent('Which Tour Guides don’t match the schedule?')?.id === 'issues' && adminIntent('Who is missing from the master roster?')?.id === 'issues');
  check('vanessa: next tour', adminIntent('When is Jordan’s next tour?')?.who === 'Jordan');
  check('vanessa: mark priority', (i => i.id === 'priority' && i.who === 'Jordan' && i.band === 'high')(adminIntent('Mark Jordan as high priority')));
  check('vanessa: match spellings', (i => i.id === 'match' && i.ext === 'Logan Tuttle' && i.who === 'Logann Tuttle')(adminIntent('Match Logan Tuttle to Logann Tuttle')));
  setRole('training');
  const NO2 = "That tool isn't available for your account.";
  check('vanessa: a committee member cannot change priority, match people, or see roster problems',
    (await Promise.all([{ id: 'priority', who: 'A', band: 'high' }, { id: 'match', ext: 'A', who: 'B' }, { id: 'issues' }].map(async i => (await runAdmin(i))?.text === NO2))).every(Boolean));
  setRole('guide');
  check('vanessa: a guide cannot see top priorities or next tours', (await Promise.all([{ id: 'top_priority' }, { id: 'next_tour', who: 'A' }].map(async i => (await runAdmin(i))?.text === NO2))).every(Boolean));


  /* --------------------------------------------------------------- training */
  check('training: statuses (old and new vocabulary) mean the same as in the database',
    attClass('Attended') === 'present' && attClass('Late') === 'present' && attClass('Makeup Completed') === 'present' && attClass('Excused') === 'excused' && attClass('Absent') === 'absent' && attClass('Absent, Need Makeup') === 'absent' && attClass('') === 'pending' && attClass(null) === 'pending');
  check('training: audience in words', audienceText({ new: true, leadership: true, guide_ids: ['a', 'b'] }, [], []) === 'New guides · Leadership · 2 chosen people' && audienceText({}) === 'Nobody yet');
  const mxr = [{ requirement_id: 'R1', guide_id: 'g1', state: 'complete' }, { requirement_id: 'R2', guide_id: 'g1', state: 'makeup_needed', next_on: '2026-10-20' }, { requirement_id: 'R1', guide_id: 'g2', state: 'waived' }, { requirement_id: 'R2', guide_id: 'g2', state: 'incomplete' }, { requirement_id: 'RX', guide_id: 'g2', state: 'incomplete' }];
  const bp = byPerson(mxr, [{ id: 'R1', name: 'Orientation' }, { id: 'R2', name: 'Safety' }]);
  check('training: per-person summary (done, missing, makeups, next)', bp.get('g1').done === 1 && bp.get('g1').makeup === 1 && bp.get('g1').next === '2026-10-20' && bp.get('g2').missing.length === 1 && bp.get('g2').rows.length === 2);
  const ti = q => trainingIntent(q)?.id || null;
  check('training: Vanessa hears the questions', ti('Who still needs training?') === 'who' && ti('Who hasn’t completed training?') === 'who' && ti('What training does Jordan still need?') === 'person' && trainingIntent('What training does Jordan still need?').who === 'Jordan' &&
    ti('Who missed training last night?') === 'missed' && ti('Who missed Tuesday?') === 'missed' && ti('When is the next makeup session?') === 'next_makeup' && ti('Who has training this week?') === 'week' && ti('How many new guides have completed orientation?') === 'new_orient' && ti('What training do I still need?') === 'me');
  check('training: Vanessa hears the actions', trainingIntent('Mark Jordan excused')?.id === 'excuse' && trainingIntent('Create a makeup training next Thursday')?.id === 'make_makeup');
  check('training: ordinary requests are not mistaken for training ones', ['brief me', 'claim noah', 'deactivate John', 'who is touring tomorrow?', 'mark Jordan as high priority', 'show me unresolved roster problems'].every(q => !trainingIntent(q)), ['brief me', 'claim noah', 'deactivate John'].map(ti).join());
  const now = new Date(2026, 9, 7, 12);   // Wednesday 7 Oct 2026
  check('training: "last night", "yesterday" and weekdays resolve to PAST dates', pastDay('last night', now) === '2026-10-06' && pastDay('yesterday', now) === '2026-10-06' && pastDay('Tuesday', now) === '2026-10-06' && pastDay('Wednesday', now) === '2026-09-30' && pastDay('Friday', now) === '2026-10-02' && pastDay('whenever', now) === null);
  setRole('guide');
  const NO3 = "That tool isn't available for your account.";
  check('training: a Tour Guide cannot ask about other people’s training or take actions',
    (await Promise.all([{ id: 'who' }, { id: 'person', who: 'A' }, { id: 'missed', when: 'yesterday' }, { id: 'excuse', who: 'A' }, { id: 'make_makeup', when: 'next thursday' }, { id: 'new_orient', what: 'x' }].map(async i => (await runTraining(i))?.text === NO3))).every(Boolean));
  setRole('training');
  check('training: a committee member cannot see names or take actions either', (await Promise.all([{ id: 'who' }, { id: 'missed', when: 'yesterday' }, { id: 'excuse', who: 'A' }].map(async i => (await runTraining(i))?.text === NO3))).every(Boolean));
  setRole('admin'); state.settings = { 'vanessa.adminActions': false };
  check('training: the Settings switch turns her training actions off too', /switched off/i.test((await runTraining({ id: 'excuse', who: 'Ella' }))?.text || '') && /switched off/i.test((await runTraining({ id: 'make_makeup', when: 'next thursday' }))?.text || ''));
  state.settings = {};

  document.getElementById('sum').textContent = `${pass} passed, ${fail} failed`;
  document.getElementById('sum').className = fail ? 'bad' : 'ok';
  document.title = fail ? `✗ ${fail} failed` : `✓ ${pass} passed`;
</script>
</body>
</html>
