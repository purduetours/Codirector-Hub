<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#09090b">
<title>Codirector Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><radialGradient id='g' cx='38%25' cy='32%25' r='75%25'><stop offset='0' stop-color='%23ffe3f1'/><stop offset='.45' stop-color='%23ff4fa3'/><stop offset='1' stop-color='%238e5bff'/></radialGradient></defs><circle cx='32' cy='32' r='26' fill='url(%23g)'/></svg>">
<script>
/* Runs before the stylesheets so a dark-mode user never gets a white flash on
   load. Deliberately inline and tiny: anything imported would arrive too late.
   Private windows can throw on localStorage, hence the try. */
window.__hubLoadedAt = Date.now();
try { var t = localStorage.getItem('hub2.theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      if (localStorage.getItem('hub2.rail') === 'folded') document.documentElement.classList.add('rail-folded'); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400..800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/flow.css">
<link rel="stylesheet" href="css/workspaces.css">
<link rel="stylesheet" href="css/noir.css">
</head>
<body>
<div class="ambient" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="a4"></i></div>

<!-- ===================================================== sign-in gate -->
<div id="gate" class="gate" hidden>
  <div class="gate-stage" aria-hidden="true">
    <div class="orb orb-xl"><i></i></div>
  </div>
  <form class="gate-card" id="gate-form">
    <div class="gate-brand">
      <span class="orb orb-sm"><i></i></span>
      <span>Codirector Hub <em>Purdue Admissions · Tour Guides</em></span>
    </div>
    <h1 class="gate-title">Welcome back.</h1>
    <p class="muted gate-lede">Sign in with your Purdue email and Vanessa will have your day ready.</p>
    <div class="gate-news" id="gate-news" hidden></div>

    <label class="field">
      <span>Purdue email</span>
      <input type="email" id="gate-email" autocomplete="username" placeholder="you@purdue.edu" required>
    </label>

    <label class="field">
      <span>Password</span>
      <input type="password" id="gate-password" autocomplete="current-password" required>
    </label>

    <label class="field" id="gate-name-wrap" hidden>
      <span>Full name</span>
      <input type="text" id="gate-name" autocomplete="name" placeholder="Jane Boilermaker">
    </label>

    <p class="form-error" id="gate-error" hidden></p>
    <button class="btn btn-primary btn-block" type="submit" id="gate-submit">Continue</button>
    <p class="hint gate-swap">
      <span id="gate-swap-text">First time here?</span>
      <button type="button" class="linkish" id="gate-swap">Make a password</button>
    </p>
  </form>
</div>

<!-- ===================================================== app -->
<div class="app" id="app" hidden>
  <div class="nav-scrim" id="nav-scrim"></div>

  <aside class="rail" aria-label="Main navigation">
    <a class="rail-brand" href="#/today" title="Home">
      <span class="orb orb-sm"><i></i></span>
      <span class="rail-brand-text">
        <h1>Codirector Hub</h1>
        <span class="sub" id="hub-term"></span>
      </span>
    </a>
    <button class="icon-btn rail-fold" id="rail-fold" type="button" aria-label="Fold the sidebar" aria-pressed="false"></button>

    <button class="rail-ask" id="rail-ask" type="button" title="Ask Vanessa">
      <span class="rail-ask-orb"><span class="orb orb-xs"><i></i></span></span>
      <span class="lbl">Ask Vanessa</span>
    </button>

    <nav id="nav"></nav>

    <div class="rail-foot">
      <button class="navlink" id="btn-rollover" hidden>
        <span class="ico" id="rollover-ico"></span><span class="lbl">End of semester</span>
      </button>
      <button class="navlink" id="btn-theme" type="button" aria-pressed="false">
        <span class="ico" id="theme-ico"></span><span class="lbl" id="theme-lbl">Dark mode</span>
      </button>
      <button class="who" data-signout title="Sign out">
        <span class="avatar" id="who-avatar">?</span>
        <span class="who-text">
          <span class="who-name" id="who-name">—</span>
          <span class="who-role" id="who-role"></span>
        </span>
        <span class="who-out" id="who-out"></span>
      </button>
      <div class="rail-ver" id="rail-ver" title="When this hub was last uploaded"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-lead">
        <button class="icon-btn burger" id="burger" aria-label="Menu"></button>
        <span class="view-ico" id="view-ico" aria-hidden="true"></span>
        <div class="topbar-title">
          <h2 id="view-title">—</h2>
          <div class="crumb" id="view-crumb"></div>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="crumb sync" id="sync"></span>
        <button class="icon-btn" id="btn-refresh" aria-label="Refresh" title="Refresh everything"><span class="spin" id="refresh-ico"></span></button>
        <button class="v-top" id="v-top" type="button" aria-label="Ask Vanessa">
          <span class="orb orb-xs"><i></i></span><span class="v-top-lbl">Vanessa</span>
        </button>
      </div>
    </header>

    <div class="v-hint" id="v-hint" hidden></div>
    <main class="view" id="view"></main>
  </div>

  <!-- Vanessa, waiting in the corner of every tool page -->
  <button class="v-float" id="v-float" type="button" aria-label="Ask Vanessa">
    <span class="orb"><i></i></span>
    <span class="v-float-text"><b id="v-float-title">Ask Vanessa</b><span id="v-float-sub"></span></span>
  </button>

  <!-- phone dock: the four things you always need within a thumb's reach -->
  <nav class="dock" aria-label="Quick navigation">
    <a class="dock-btn" href="#/today" data-dock="today"><span class="ico" id="dock-home-ico"></span><span>Home</span></a>
    <button class="dock-btn dock-v" type="button" id="dock-vanessa"><span class="orb orb-sm"><i></i></span><span>Vanessa</span></button>
    <button class="dock-btn" type="button" id="dock-menu"><span class="ico" id="dock-menu-ico"></span><span>Tools</span></button>
  </nav>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="config.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
