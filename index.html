<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Codirector Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<!-- ===================================================== sign-in gate -->
<div id="gate" class="gate" hidden>
  <form class="gate-card" id="gate-form">
    <div class="gate-mark">🎓</div>
    <h1>Codirector Hub</h1>
    <p class="muted">Sign in with your committee access code.</p>

    <label class="field">
      <span>Who are you?</span>
      <input list="committee-list" id="gate-name" autocomplete="name" placeholder="Your name" required>
      <datalist id="committee-list"></datalist>
    </label>

    <label class="field" id="gate-code-field">
      <span>Access code</span>
      <input type="password" id="gate-code" autocomplete="current-password" placeholder="Committee or admin code">
    </label>

    <p class="form-error" id="gate-error" hidden></p>
    <button class="btn btn-primary btn-block" type="submit" id="gate-submit">Continue</button>
    <p class="hint">Codirectors: use the admin code to unlock the extra tools.</p>
  </form>
</div>

<!-- ===================================================== app -->
<div class="app" id="app" hidden>
  <div class="nav-scrim" id="nav-scrim"></div>

  <aside class="rail">
    <div class="rail-brand">
      <span class="rail-mark">🎓</span>
      <div>
        <h1>Codirector Hub</h1>
        <div class="sub" id="hub-term"></div>
      </div>
    </div>

    <div id="nav"></div>

    <div class="rail-foot">
      <button class="navlink" id="btn-rollover" hidden>
        <span class="ico">🔄</span><span class="lbl">End of semester</span>
      </button>
      <button class="who" data-signout title="Switch user">
        <span class="avatar" id="who-avatar">?</span>
        <span style="min-width:0">
          <span class="who-name" id="who-name">—</span>
          <span class="who-role" id="who-role"></span>
        </span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px;min-width:0">
        <button class="icon-btn burger" id="burger" aria-label="Menu">☰</button>
        <div style="min-width:0">
          <h2 id="view-title">—</h2>
          <div class="crumb" id="view-crumb"></div>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="crumb" id="sync"></span>
        <button class="btn btn-ghost btn-sm" id="btn-refresh"><span class="spin">⟳</span> Refresh</button>
      </div>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="config.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
