<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Codirector Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<script>
/* Runs before the stylesheets so a dark-mode user never gets a white flash on
   load. Deliberately inline and tiny: anything imported would arrive too late.
   Private windows can throw on localStorage, hence the try. */
window.__hubLoadedAt = Date.now();
try { var t = localStorage.getItem('hub2.theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<!-- ===================================================== sign-in gate -->
<div id="gate" class="gate" hidden>
  <form class="gate-card" id="gate-form">
    <div class="gate-mark">🎓</div>
    <h1>Codirector Hub</h1>
    <p class="muted">Sign in with your Purdue email.</p>

    <label class="field">
      <span>Purdue email</span>
      <input type="email" id="gate-email" autocomplete="username" placeholder="you@purdue.edu" required>
    </label>

    <label class="field">
      <span>Password</span>
      <input type="password" id="gate-password" autocomplete="current-password" required>
    </label>

    <label class="field" id="gate-name-wrap" hidden>
      <span>Full name</span>
      <input type="text" id="gate-name" autocomplete="name" placeholder="Jane Boilermaker">
    </label>

    <p class="form-error" id="gate-error" hidden></p>
    <button class="btn btn-primary btn-block" type="submit" id="gate-submit">Continue</button>
    <p class="hint">
      <span id="gate-swap-text">First time here?</span>
      <button type="button" class="linkish" id="gate-swap">Make a password</button>
    </p>
  </form>
</div>

<!-- ===================================================== app -->
<div class="app" id="app" hidden>
  <div class="nav-scrim" id="nav-scrim"></div>

  <aside class="rail">
    <div class="rail-brand">
      <span class="rail-mark">🎓</span>
      <div>
        <h1>Codirector Hub</h1>
        <div class="sub" id="hub-term"></div>
      </div>
    </div>

    <div id="nav"></div>

    <div class="rail-foot">
      <button class="navlink" id="btn-rollover" hidden>
        <span class="ico">🔄</span><span class="lbl">End of semester</span>
      </button>
      <div class="rail-ver" id="rail-ver" title="When this hub was last uploaded"></div>
      <button class="navlink" id="btn-theme" type="button" aria-pressed="false">
        <span class="ico" id="theme-ico">🌙</span><span class="lbl" id="theme-lbl">Dark mode</span>
      </button>
      <button class="who" data-signout title="Switch user">
        <span class="avatar" id="who-avatar">?</span>
        <span style="min-width:0">
          <span class="who-name" id="who-name">—</span>
          <span class="who-role" id="who-role"></span>
        </span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px;min-width:0">
        <button class="icon-btn burger" id="burger" aria-label="Menu">☰</button>
        <div style="min-width:0">
          <h2 id="view-title">—</h2>
          <div class="crumb" id="view-crumb"></div>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="crumb" id="sync"></span>
        <button class="btn btn-ghost btn-sm" id="btn-refresh"><span class="spin">⟳</span> Refresh</button>
      </div>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="config.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
